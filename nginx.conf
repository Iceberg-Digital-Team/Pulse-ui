server {
    listen 80;
    root /usr/share/nginx/html;

    # Hashed build assets never change
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Agencies load this from their sites; keep it fresh-ish so fixes reach them
    location = /embed.js {
        add_header Cache-Control "public, max-age=300";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # property-ai.co.uk and every <slug>.property-ai.co.uk are the same app: it reads the company
    # from the host name and styles itself from the API config
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
